<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fb;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        .metric {
            font-size: 28px;
            font-weight: bold;
        }
        .label {
            color: #666;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🛠 Admin Dashboard</h1>

    <p class="label">Usuario logueado</p>
    <div class="metric">{{ admin_email }}</div>

    <hr>

    <p class="label">Usuarios totales</p>
    <div class="metric">{{ total_users }}</div>

    <p class="label">Usuarios nuevos este mes</p>
    <div class="metric">{{ new_users_month }}</div>
</div>

</body>
</html>
