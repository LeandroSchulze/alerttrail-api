<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AlertTrail</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, system-ui, Segoe UI, Roboto, Ubuntu, Arial, sans-serif;
            background: 
                radial-gradient(circle at top, rgba(56,189,248,0.15) 0, transparent 45%),
                radial-gradient(circle at bottom, rgba(59,130,246,0.15) 0, transparent 55%),
                linear-gradient(to bottom, #f0f9ff, #dbeafe);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            border: 1px solid #dbeafe;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }
        h1 { 
            margin: 0 0 24px; 
            font-size: 1.6rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 12px;
        }
        .metric {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-top: 4px;
        }
        .label {
            color: #64748b;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🛠️ Admin Dashboard</h1>

    <div class="grid">
        <div class="item">
            <p class="label">Usuario logueado</p>
            <div class="metric" style="font-size: 1.15rem; font-weight: 600; color: #0ea5e9; word-break: break-all;">
                {{ admin_email }}
            </div>
        </div>

        <hr>

        <div class="item" style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
            <div>
                <p class="label">Usuarios totales</p>
                <div class="metric">{{ total_users }}</div>
            </div>
            <div style="text-align: right;">
                <p class="label">Nuevos este mes</p>
                <div class="metric" style="color: #22c55e;">+{{ new_users_month }}</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
