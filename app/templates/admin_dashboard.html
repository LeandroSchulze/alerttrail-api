<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – AlertTrail</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fb;
      padding: 40px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 500px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    h1 {
      margin-bottom: 8px;
    }
    .metric {
      font-size: 32px;
      font-weight: bold;
    }
    .label {
      color: #666;
    }
  </style>
</head>
<body>

  <h1>Admin Dashboard</h1>
  <p>Logged as <strong>{{ current_user.email }}</strong></p>

  <div class="card">
    <div class="label">Total users</div>
    <div class="metric">{{ total_users }}</div>
  </div>

  <div class="card">
    <div class="label">New users – {{ month }}</div>
    <div class="metric">{{ new_users_month }}</div>
  </div>

</body>
</html>
