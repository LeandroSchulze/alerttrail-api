<!doctype html>
<html lang="{{ (lang or 'es') if lang is defined else 'es' }}">
<head>
  <meta charset="utf-8">
  <title>{{ t("mail.page_title") }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/toast.js"></script>
  <script src="/static/alert_clients.js" defer></script>
</head>

<body style="margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;background:#f8fafc;color:#0f172a;">
  <div style="max-width:980px;margin:20px auto;padding:0 16px 32px;">
    <h1 style="margin:0 0 6px;font-size:1.55rem;">{{ t("mail.title") }}</h1>
    <p style="margin:0 0 14px;color:#64748b;">
      {{ t("mail.subtitle") }}
    </p>

    <div style="background:white;border:1px solid #dbeafe;border-radius:14px;padding:14px;box-shadow:0 10px 25px rgba(15,23,42,.06);">
      <form method="post" action="/mail/settings" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div style="grid-column:1/3;">
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.address") }}</label>
          <input name="address" value="{{ (linked.address if linked else '') or '' }}"
                 placeholder="tu@email.com"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div>
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.host") }}</label>
          <input name="host" value="{{ (linked.host if linked else defaults.host) }}"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div>
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.port") }}</label>
          <input name="port" value="{{ (linked.port if linked else defaults.port) }}"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div>
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.username") }}</label>
          <input name="username" value="{{ (linked.username if linked else '') or '' }}"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div>
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.password") }}</label>
          <input name="password" type="password" value="{{ (linked.password if linked else '') or '' }}"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div>
          <label style="display:block;font-weight:700;margin-bottom:4px;">{{ t("mail.folder") }}</label>
          <input name="folder" value="{{ (linked.folder if linked else defaults.folder) }}"
                 style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;">
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" name="use_ssl"
                 {% if (linked.use_ssl if linked else true) %}checked{% endif %}>
          <span>{{ t("mail.use_ssl") }}</span>
        </div>

        <div style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" name="mark_read"
                 {% if (linked.mark_read if linked else false) %}checked{% endif %}>
          <span>{{ t("mail.mark_read") }}</span>
        </div>

        <div style="grid-column:1/3;display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;">
          <button type="submit"
                  style="border:none;padding:9px 14px;border-radius:999px;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:white;font-weight:800;">
            {{ t("common.save") }}
          </button>
          <a href="/mail/scanner"
             style="text-decoration:none;border:1px solid rgba(148,163,184,.6);padding:9px 14px;border-radius:999px;background:#fff;color:#0f172a;font-weight:700;">
            {{ t("mail.go_scanner") }}
          </a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
