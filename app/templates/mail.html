<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlertTrail — Mail</title>

    <link rel="stylesheet" href="/static/style.css" />

    <!-- alerts popups -->
    <script defer src="/static/toast.js"></script>
    <script defer src="/static/alert_clients.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">AlertTrail</div>
          <div class="brand-sub">Security Console</div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="/">Dashboard</a>
          <a class="nav-item" href="/mail">Mail</a>
          <a class="nav-item" href="/mail/scanner">Mail Scanner</a>
        </nav>
      </aside>

      <main class="content">
        <header class="content-header">
          <h1>Configuración de Mail</h1>
          <p>Configurá tu casilla para escaneo y alertas.</p>
        </header>

        <section class="card">
          <form method="post" action="/mail/save" class="form-grid">
            <div class="form-row">
              <label>Email</label>
              <input name="email" placeholder="tu@mail.com" value="{{ settings.get('email','') }}" />
            </div>

            <div class="form-row">
              <label>Proveedor</label>
              <input name="provider" placeholder="Gmail / Outlook / IMAP" value="{{ settings.get('provider','') }}" />
            </div>

            <div class="form-row">
              <label>Host</label>
              <input name="host" placeholder="imap.gmail.com" value="{{ settings.get('host','') }}" />
            </div>

            <div class="form-row">
              <label>Port</label>
              <input name="port" type="number" placeholder="993" value="{{ settings.get('port', 993) }}" />
            </div>

            <div class="form-row">
              <label>Username</label>
              <input name="username" placeholder="usuario" value="{{ settings.get('username','') }}" />
            </div>

            <div class="form-row">
              <label>Password</label>
              <input name="password" type="password" placeholder="********" value="{{ settings.get('password','') }}" />
            </div>

            <div class="form-row">
              <label>SSL</label>
              <input name="ssl" type="checkbox" {% if settings.get('ssl', True) %}checked{% endif %} />
            </div>

            <div class="form-actions">
              <button class="btn" type="submit">Guardar</button>
              <a class="btn secondary" href="/mail/scanner">Ir al scanner</a>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
