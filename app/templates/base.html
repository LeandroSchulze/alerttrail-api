<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AlertTrail</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
  
  {% if user and (user.plan_expires or user.pro_until) %}
<script>
(function(){
  try{
    var exp = "{{ (user.plan_expires or user.pro_until)|string }}";
    if(!exp) return;
    var d = new Date(exp);
    if(isNaN(d.getTime())) return;
    var ms = d - new Date();
    var days = Math.ceil(ms / (1000*60*60*24));
    if(days <= 7){
      var bar = document.createElement('div');
      bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#0f766e;color:#ecfeff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:60";
      bar.innerHTML = "<span>Tu plan PRO vence en "+days+" día(s).</span><a href='/billing' style='background:#ecfeff;color:#134e4a;padding:6px 10px;border-radius:10px;text-decoration:none;font-weight:700'>Renovar</a>";
      document.body.appendChild(bar);
    }
  }catch(e){}
})();
</script>
{% endif %}

<body>
  <div class="container">
    {% block body %}{% endblock %}
  </div>
</body>
  <a id="alerts-fab" href="/alerts"
  style="position:fixed;right:16px;bottom:16px;z-index:50;text-decoration:none;">
  <span style="display:inline-flex;align-items:center;gap:8px;background:#111827;color:#fff;
    border-radius:999px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25)">
    🔔 <span id="alerts-fab-count"
      style="background:#ef4444;border-radius:999px;padding:2px 8px;min-width:18px;text-align:center">0</span>
    <span>Alertas</span>
  </span>
</a>
<script>
async function refreshFab(){
  try{
    const r = await fetch('/alerts/unread-count', {credentials:'include'});
    if(!r.ok) return;
    const d = await r.json();
    document.getElementById('alerts-fab-count').textContent = d.count || 0;
  }catch(e){}
}
refreshFab(); setInterval(refreshFab,15000);
</script>

</html>
