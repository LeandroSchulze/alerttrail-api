<!-- templates/upgrade.html -->
<!DOCTYPE html>
<html lang="{{ (lang or 'es') if lang is defined else 'es' }}">
<head>
  <meta charset="UTF-8" />
  <title>Activar PRO – AlertTrail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 24px; }
    .card { max-width: 560px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
    .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .desc { color: #4b5563; margin-bottom: 16px; }
    button { padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer; }
    .primary { background: #111827; color: #fff; }
    .muted { background: #f3f4f6; color: #111827; }
    .status { margin-top: 16px; color: #374151; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Plan PRO</div>
    <div class="desc">Accedé a funciones avanzadas y reportes. El pago es procesado por Mercado Pago.</div>
    <div id="pro-status" class="status">Cargando estado...</div>
    <div style="display:flex; gap:8px; margin-top: 12px;">
      <button id="btn-upgrade" class="primary">Activar PRO</button>
      <a href="/dashboard"><button class="muted">Volver al dashboard</button></a>
    </div>
  </div>

  <script>
    async function refreshStatus() {
      try {
        const r = await fetch('/subscription/me');
        const d = await r.json();
        const el = document.getElementById('pro-status');
        if (d.plan === 'PRO' && d.pro_expires_at) {
          el.textContent = 'PRO activo hasta: ' + d.pro_expires_at;
          document.getElementById('btn-upgrade').classList.add('hidden');
        } else {
          el.textContent = 'Plan gratuito';
          document.getElementById('btn-upgrade').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('pro-status').textContent = 'No se pudo obtener el estado.';
      }
    }

    async function startCheckout() {
      try {
        const r = await fetch('/payments/checkout', { method: 'POST' });
        if (!r.ok) throw new Error('No se pudo iniciar el checkout.');
        const d = await r.json();
        if (d.init_point) window.location.href = d.init_point;
      } catch (e) {
        alert(e.message || 'Error al iniciar el checkout.');
      }
    }

    document.getElementById('btn-upgrade').addEventListener('click', startCheckout);
    refreshStatus();
  </script>
</body>
</html>
