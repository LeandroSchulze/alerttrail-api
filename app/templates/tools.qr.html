<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>QR Scan — AlertTrail</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;margin:24px;color:#0f172a}
    .card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;max-width:960px}
    .muted{color:#64748b}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;cursor:pointer}
    .btn.primary{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
    video{width:100%;max-width:520px;border-radius:12px;border:1px solid #e2e8f0}
    pre{background:#0f172a0d;padding:12px;border-radius:10px;overflow:auto}
    .chip{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #c7d2fe;background:#eef2ff;color:#1e3a8a;font-size:12px;font-weight:700}
    .chip.red{border-color:#fecaca;background:#fee2e2;color:#7f1d1d}
    .chip.yellow{border-color:#fde68a;background:#fef3c7;color:#7c2d12}
  </style>
</head>
<body>
  <h1 style="margin-top:0">Escáner de QR Phishing <span class="chip yellow">BETA</span></h1>
  <p class="muted">Funciona mejor en HTTPS y móviles. Si la cámara no está disponible, subí una imagen del QR.</p>

  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <button id="openCam" class="btn primary" {% if mode=='file' %}disabled{% endif %}>Abrir cámara</button>
      <input id="fileInput" type="file" accept="image/*" class="btn">
      <a href="/dashboard" class="btn">Volver</a>
    </div>

    <video id="video" playsinline muted></video>

    <div id="result" style="margin-top:12px"></div>
    <div id="debug" style="margin-top:12px"></div>
  </div>

<script>
  // NOTA: Para mantenerlo liviano/seguro no incluimos librerías externas.
  // Usamos BarcodeDetector si está disponible (Chrome/Android). Si no, solo modo archivo.
  const video = document.getElementById('video');
  const result = document.getElementById('result');
  const debug = document.getElementById('debug');

  function riskBadge(level){
    if(level==='high') return '<span class="chip red">HIGH</span>';
    if(level==='medium') return '<span class="chip yellow">MEDIUM</span>';
    return '<span class="chip">LOW</span>';
  }
  function scoreUrl(u){
    const L = u.toLowerCase();
    let hits = [];
    const badTLD = /(zip|mov|tk|top|gq|ml|ga|cf)$/;
    if (L.includes("bit.ly") || L.includes("tinyurl") || L.includes("t.co")) hits.push("acortador");
    if (badTLD.test((new URL(u)).hostname.split(".").pop()||"")) hits.push("tld riesgoso");
    if (/(login|verify|update|reset)/.test(L)) hits.push("palabras sensibles");
    let level = "low";
    if (hits.length>=2) level="medium";
    if (hits.length>=3) level="high";
    return {level, reasons:hits};
  }

  async function startCam(){
    if (!('BarcodeDetector' in window)) {
      result.innerHTML = '<div class="muted">Tu navegador no soporta lectura de QR por cámara. Usá “Subir imagen”.</div>';
      return;
    }
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
    await video.play();

    const detector = new BarcodeDetector({formats:['qr_code']});
    const scan = async () => {
      try{
        const codes = await detector.detect(video);
        if (codes && codes[0]) {
          const raw = codes[0].rawValue || "";
          let html = `<div><b>Contenido QR:</b> ${raw}</div>`;
          try{
            const u = new URL(raw);
            const sc = scoreUrl(u.href);
            html += `<div style="margin-top:6px">Riesgo: ${riskBadge(sc.level)}</div>`;
            if(sc.reasons.length) html += `<div class="muted">Motivos: ${sc.reasons.join(", ")}</div>`;
          }catch(_){}
          result.innerHTML = html;
        }
      }catch(e){}
      requestAnimationFrame(scan);
    };
    scan();
  }

  document.getElementById('openCam').onclick = startCam;

  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(!f){return}
    // Sin librerías externas, intentamos leer texto de la imagen con <canvas> y QR es MUY limitado.
    // Para la beta, mostramos metadata y sugerimos abrir en otra pestaña si contiene URL en EXIF no está disponible.
    result.innerHTML = `<div>Imagen cargada: <b>${f.name}</b> (${f.type || 'tipo desconocido'})</div>
                        <div class="muted" style="margin-top:6px">Sugerencia: si el QR abre una URL, verás la advertencia del navegador antes de continuar.</div>`;
  });
</script>
</body>
</html>
